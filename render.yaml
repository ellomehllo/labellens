# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: labellens
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      # Any supported key: Anthropic (sk-ant-), OpenAI (sk-), Google Gemini (AIza) or OpenRouter (sk-or-).
      - key: AI_API_KEY
        sync: false
      - key: LABELLENS_DAILY_LIMIT
        value: "100"
